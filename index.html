<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFE600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Registro de sacas por nodo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top">
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/>
          </svg>
        </span>
        <div>
          <h1 class="header__title" data-i18n="titulo">Sacas por nodo</h1>
          <p class="header__subtitle" data-i18n="subtitulo">Registro de recolección</p>
        </div>
      </div>
      <span class="tag" id="estado-tag" hidden></span>
    </header>
    <div class="meter" aria-hidden="true">
      <span class="meter__seg" id="seg-pais"></span>
      <span class="meter__seg" id="seg-site"></span>
      <span class="meter__seg" id="seg-nodo"></span>
      <span class="meter__seg" id="seg-sacas"></span>
    </div>
  </div>

  <main class="main">
    <div class="banner" id="pendientes" hidden>
      <p class="banner__text" id="pendientes-texto"></p>
      <button type="button" class="banner__btn" id="reintentar" data-i18n="reintentar">Reintentar</button>
    </div>

    <section class="card" id="form-card">
      <form id="form" novalidate>

        <fieldset class="field">
          <legend class="label" data-i18n="pais">País</legend>
          <div class="chips chips--pais" id="paises" role="radiogroup"></div>
          <p class="field__hint" id="pais-nota" hidden></p>
          <p class="field__error" id="pais-error" role="alert" hidden></p>
        </fieldset>

        <div class="field">
          <label class="label" for="site-btn" data-i18n="site">SVC</label>
          <div class="select-wrap">
            <button type="button" class="picker" id="site-btn" aria-haspopup="dialog" disabled></button>
          </div>
          <p class="field__error" id="site-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label class="label" for="nodo-btn" data-i18n="nodo">Nodo</label>
          <div class="select-wrap">
            <button type="button" class="picker" id="nodo-btn" aria-haspopup="dialog" disabled></button>
          </div>
          <p class="field__error" id="nodo-error" role="alert" hidden></p>
          <p class="field__hint" id="nodo-nota" hidden></p>
          <div class="nodo-info" id="nodo-info" hidden>
            <p class="nodo-info__titulo" data-i18n="nodo_recibio">Sacas que recibió este nodo</p>
            <div class="nodo-info__grid">
              <div><span class="nodo-info__num" id="nodo-d1">0</span><span class="nodo-info__lbl" data-i18n="ayer">Ayer</span></div>
              <div><span class="nodo-info__num" id="nodo-3d">0</span><span class="nodo-info__lbl" id="nodo-lbl-acum">Últimos 4 días</span></div>
            </div>
            <p class="nodo-info__corte" id="nodo-corte"></p>
          </div>
        </div>

        <div class="field">
          <label class="label" for="sacas" data-i18n="sacas">Sacas recolectadas</label>
          <div class="stepper">
            <button type="button" class="stepper__btn" id="menos" data-i18n-aria="menos" aria-label="Restar una saca">&minus;</button>
            <input class="input stepper__input" id="sacas" name="sacas" type="text" inputmode="numeric"
                   pattern="[0-9]*" autocomplete="off" enterkeyhint="send" placeholder="0" required />
            <button type="button" class="stepper__btn" id="mas" data-i18n-aria="mas" aria-label="Sumar una saca">+</button>
          </div>
          <p class="field__hint" data-i18n="sacas_hint">Solo números, de 1 a 1000.</p>
          <p class="field__error" id="sacas-error" role="alert" hidden></p>
          <p class="cmp" id="cmp" aria-live="polite" hidden></p>
        </div>

        <div class="error-box" id="erro-catalogo" role="alert" hidden></div>
        <div class="error-box" id="erro-geral" role="alert" hidden></div>

        <button type="submit" class="btn-primary" id="enviar" disabled>
          <span class="btn-primary__label" data-i18n="enviar">Enviar registro</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <section class="card card--success" id="sucesso-card" hidden>
      <div class="success-icon" id="exito-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#00A650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2 class="success-title" id="exito-titulo"></h2>
      <p class="success-note" id="exito-nota" hidden></p>
      <dl class="summary">
        <div class="summary__row"><dt data-i18n="r_site">SVC</dt><dd id="resumo-site"></dd></div>
        <div class="summary__row"><dt data-i18n="r_nodo">Nodo</dt><dd id="resumo-nodo"></dd></div>
        <div class="summary__row"><dt data-i18n="r_sacas">Recolectadas</dt><dd id="resumo-sacas"></dd></div>
        <div class="summary__row" id="fila-ref" hidden><dt data-i18n="r_ref">Recibió</dt><dd id="resumo-ref"></dd></div>
        <div class="summary__row" id="fila-vs" hidden><dt data-i18n="r_vs">Contra lo recibido</dt><dd id="resumo-vs"></dd></div>
        <div class="summary__row"><dt data-i18n="r_folio">Folio</dt><dd id="resumo-id" class="mono"></dd></div>
      </dl>
      <button type="button" class="btn-primary" id="novo" data-i18n="nuevo">Nuevo registro</button>
    </section>

    <section class="recent" id="recientes" hidden>
      <h2 class="recent__title"><span data-i18n="recientes">Últimos registros</span> <span class="recent__count" id="recientes-hoy"></span></h2>
      <ul class="recent__list" id="recientes-lista"></ul>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-texto"></span>
  </footer>

  <!-- Selector de site (hoja inferior con búsqueda) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" id="sheet-backdrop"></div>
    <div class="sheet__panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheet-title" data-i18n="site_titulo">Selecciona tu SVC</h2>
        <button type="button" class="sheet__close" id="sheet-close" data-i18n-aria="cerrar" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet__search">
        <input class="input" id="site-buscar" type="search" autocomplete="off" autocapitalize="characters"
               spellcheck="false" enterkeyhint="search" data-i18n-ph="site_buscar" placeholder="Buscar SVC" />
      </div>
      <p class="sheet__count" id="site-cuenta" aria-live="polite"></p>
      <ul class="sheet__list" id="site-lista"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
